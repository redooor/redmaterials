name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main, master]

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run dist

      - name: Build docs
        run: npm run build:docs

      - name: Docs unit tests
        run: npm run test:docs

      - name: Browser checks (JavaScript behaviour, docs over file:// and http)
        if: matrix.node == 20
        run: |
          export CHROME="$(command -v google-chrome)"
          node scripts/browser/redmaterials-js-check.mjs
          node scripts/browser/docs-check.mjs file
          node scripts/browser/docs-check.mjs http
          node scripts/browser/contrast-audit.mjs --selftest
          for theme in redmaterials bootstrap; do
            for mode in light dark; do
              node scripts/browser/contrast-audit.mjs http --theme "$theme" --mode "$mode" --widths 1280,360
            done
          done

      - name: Committed docs and dist are up to date (tracked and untracked files)
        if: matrix.node == 20
        run: |
          git add -N docs dist
          git diff --exit-code -- docs dist
          test -z "$(git status --porcelain -- docs dist)"

      - name: Colour roles are in sync with the compiled CSS, and no neutral colour bypasses the dark-mode tokens
        if: matrix.node == 20
        run: |
          node scripts/audit-colors.mjs --doc > /tmp/COLOR-ROLES.md
          diff scss/COLOR-ROLES.md /tmp/COLOR-ROLES.md
          node scripts/audit-colors.mjs --check

      - name: Docs build is deterministic
        if: matrix.node == 20
        run: |
          npm run build:docs:html
          cp docs/index.html /tmp/index-a.html
          cp docs/redmaterials.html /tmp/redmaterials-a.html
          npm run build:docs:html
          cmp docs/index.html /tmp/index-a.html
          cmp docs/redmaterials.html /tmp/redmaterials-a.html

      - name: Upload dist artifact
        if: always() && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
