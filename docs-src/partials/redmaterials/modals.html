<!-- Dialogs
================================================== -->
<div id="modals" class="container pt-3">
    <div class="pt-5">
        <div class="row">
            <div class="col">
                <h1>Modals</h1>
                <h4>Modal with progress bar</h4>
                <div class="bs-component mb-4">
                    <div class="modal position-static d-block" tabindex="-1" role="dialog">
                        <div class="modal-dialog" role="document">
                            <div class="progress">
                                <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 80%">
                                    <span class="visually-hidden">Loading</span>
                                </div>
                            </div>
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Modal title</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <p>Modal body text goes here.</p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-link" data-bs-dismiss="modal">Close</button>
                                    <button type="button" class="btn btn-primary">Save changes</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p>Simply add usual progress markup before <i>modal-content</i>.</p>
