<div class="m-3 d-grid gap-2">
  <div data-bs-theme="dark" class="bg-body rounded p-2 d-grid gap-2">
    <div class="btn-group-vertical btn-group-sm" role="group" aria-label="Theme">
      <input type="radio" class="btn-check" name="theme" id="theme-bs" value="bootstrap">
      <label class="btn btn-outline-light" for="theme-bs">Bootstrap</label>
      <input type="radio" class="btn-check" name="theme" id="theme-rdm" value="redmaterials">
      <label class="btn btn-outline-light" for="theme-rdm">Redmaterials</label>
    </div>
    <div class="btn-group-vertical btn-group-sm" role="group" aria-label="Colour mode">
      <input type="radio" class="btn-check" name="color-mode" id="mode-light" value="light">
      <label class="btn btn-outline-light" for="mode-light">Light</label>
      <input type="radio" class="btn-check" name="color-mode" id="mode-dark" value="dark">
      <label class="btn btn-outline-light" for="mode-dark">Dark</label>
      <input type="radio" class="btn-check" name="color-mode" id="mode-auto" value="auto">
      <label class="btn btn-outline-light" for="mode-auto">Auto</label>
    </div>
  </div>
</div>
