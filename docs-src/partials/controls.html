<div class="m-3 d-grid gap-2">
  <div class="btn-group btn-group-sm" role="group" aria-label="Theme">
    <input type="radio" class="btn-check" name="theme" id="theme-bs" value="bootstrap">
    <label class="btn btn-outline-secondary" for="theme-bs">Bootstrap</label>
    <input type="radio" class="btn-check" name="theme" id="theme-rdm" value="redmaterials">
    <label class="btn btn-outline-secondary" for="theme-rdm">Redmaterials</label>
  </div>
  <div class="btn-group btn-group-sm" role="group" aria-label="Colour mode">
    <input type="radio" class="btn-check" name="color-mode" id="mode-light" value="light">
    <label class="btn btn-outline-secondary" for="mode-light">Light</label>
    <input type="radio" class="btn-check" name="color-mode" id="mode-dark" value="dark">
    <label class="btn btn-outline-secondary" for="mode-dark">Dark</label>
    <input type="radio" class="btn-check" name="color-mode" id="mode-auto" value="auto">
    <label class="btn btn-outline-secondary" for="mode-auto">Auto</label>
  </div>
</div>
